
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>Ibnu Gisan — My Website</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #101827;
      color: #f8fafc;
      font-family: -apple-system, Arial, sans-serif;
    }

    main {
      width: 100%;
      max-width: 560px;
      padding: 36px 24px;
      text-align: center;
      border: 1px solid #334155;
      border-radius: 24px;
      background: #172235;
    }

    .tag {
      color: #7dd3fc;
      letter-spacing: 3px;
      font-size: 12px;
    }

    h1 {
      font-size: clamp(36px, 10vw, 56px);
      margin: 20px 0 12px;
    }

    p {
      color: #cbd5e1;
      line-height: 1.7;
    }

    button {
      margin-top: 18px;
      padding: 13px 22px;
      border: 0;
      border-radius: 12px;
      background: #38bdf8;
      color: #082f49;
      font-weight: bold;
      font-size: 16px;
    }

    #message { color: #7dd3fc; }
  </style>
</head>
<body>
  <main>
    <div class="tag">WELCOME TO MY WEBSITE</div>
    <h1>Hi, I'm Ibnu.</h1>
    <p>
      Ini website pribadiku.
      Tempatku belajar, berkarya, dan
      membangun sesuatu di internet.
    </p>
    <button id="helloButton">Klik aku ✨</button>
    <p id="message" aria-live="polite"></p>
  </main>

  <script>
    document.getElementById("helloButton")
      .addEventListener("click", () => {
        document.getElementById("message").textContent =
          "Halo! Terima kasih sudah berkunjung 🚀";
      });
  </script>
</body>
</html>
